<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de registro</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial;background:#f0f2f5;padding:20px;}
    .formulario{max-width:800px;margin:auto;background:white;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,0.1);overflow:hidden;}
    .titulo{background:#1e3c72;color:white;padding:20px;text-align:center;}
    .cuerpo{padding:25px;}
    .campo{margin-bottom:15px;}
    label{display:block;font-weight:bold;margin-bottom:5px;}
    input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:12px;}
    .check{margin:20px 0;background:#f9f9f9;padding:12px;border-radius:16px;}
    .check label{display:flex;gap:10px;font-weight:normal;}
    button{background:#1e3c72;color:white;border:none;padding:12px;width:100%;border-radius:40px;font-size:1.1rem;font-weight:bold;cursor:pointer;}
    .mensaje{margin-top:20px;padding:12px;border-radius:30px;text-align:center;display:none;}
    .exito{background:#d4edda;color:#155724;}
    .error{background:#f8d7da;color:#721c24;}
    .enviando{background:#cce5ff;color:#004085;}
  </style>
</head>
<body>
<div class="formulario">
  <div class="titulo">
    <h2>Formulario de registro</h2>
    <p>Completa los datos. Los campos con * son obligatorios.</p>
  </div>
  <div class="cuerpo">
    <form id="miFormulario">
      <div class="campo"><label>Nombre completo *</label><input type="text" id="nombre" required></div>
      <div class="campo"><label>Cédula *</label><input type="text" id="cedula" required></div>
      <div class="campo"><label>Profesión / Estudiante *</label><select id="profesion" required><option value="">Selecciona</option><option>Profesional</option><option>Estudiante</option><option>Otro</option></select></div>
      <div class="campo"><label>Especialidad</label><input type="text" id="especialidad"></div>
      <div class="campo"><label>Ciudad *</label><input type="text" id="ciudad" required></div>
      <div class="campo"><label>Teléfono *</label><input type="tel" id="telefono" required></div>
      <div class="campo"><label>Correo electrónico *</label><input type="email" id="correo" required></div>
      <div class="campo"><label>Institución</label><input type="text" id="institucion"></div>
      <div class="check"><label><input type="checkbox" id="autorizacion" required> <strong>Autorizo el tratamiento de mis datos personales</strong> *</label></div>
      <button type="submit">Enviar registro</button>
    </form>
    <div id="mensajeRespuesta" class="mensaje"></div>
  </div>
</div>

<script>
  // ⚠️ REEMPLAZA ESTA URL POR LA QUE TIENES EN APPS SCRIPT
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRR5LG_hIbtueUZ9HjO0OAvViXva_Y6-BRMj6RfYegWEGA0GwKTt8F-GKJXs-8p4luJg/exec';
  
  const form = document.getElementById('miFormulario');
  const mensajeDiv = document.getElementById('mensajeRespuesta');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    mensajeDiv.style.display = 'none';
    mensajeDiv.innerHTML = 'Enviando...';
    mensajeDiv.className = 'mensaje enviando';
    mensajeDiv.style.display = 'block';
    
    const datos = {
      nombre: document.getElementById('nombre').value,
      cedula: document.getElementById('cedula').value,
      profesion: document.getElementById('profesion').value,
      especialidad: document.getElementById('especialidad').value,
      ciudad: document.getElementById('ciudad').value,
      telefono: document.getElementById('telefono').value,
      correo: document.getElementById('correo').value,
      institucion: document.getElementById('institucion').value,
      autorizacion: document.getElementById('autorizacion').checked
    };
    
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      
      mensajeDiv.innerHTML = '✅ ¡Registro exitoso! Tus datos han sido guardados.';
      mensajeDiv.className = 'mensaje exito';
      form.reset();
    } catch (error) {
      mensajeDiv.innerHTML = '❌ Error al enviar. Por favor intenta de nuevo.';
      mensajeDiv.className = 'mensaje error';
      console.error('Error:', error);
    }
    
    setTimeout(() => { mensajeDiv.style.display = 'none'; }, 5000);
  });
</script>
</body>
</html>
