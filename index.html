<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Simposio Oncología | Liga AMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f8 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-wrapper {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    /* Tarjeta con borde suave (20px en lugar de 32px) */
    .form-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    /* Cabecera: solo la imagen */
    .hero-image {
      width: 100%;
      display: block;
    }
    .hero-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Cuerpo del formulario */
    .card-body {
      padding: 32px 28px;
      background: white;
    }

    /* Grid de campos */
    .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .field {
      flex: 1 1 calc(50% - 20px);
      min-width: 200px;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .required {
      color: #f3218b;
      margin-left: 3px;
    }
    /* Campos con borde suave (12px en lugar de 16px) */
    input, select {
      width: 100%;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      color: #0f172a;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #f3218b;
      box-shadow: 0 0 0 3px rgba(243, 33, 139, 0.1);
      background: white;
    }

    /* Checkbox con borde suave (14px en lugar de 20px) */
    .checkbox-field {
      background: #f8fafc;
      border-radius: 14px;
      padding: 16px 20px;
      margin: 16px 0 24px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }
    .checkbox-field:hover {
      border-color: #f3218b;
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #1e293b;
      line-height: 1.4;
    }
    .checkbox-label input {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: #f3218b;
    }
    .checkbox-label strong {
      color: #081135;
    }

    /* Botón con borde suave (40px en lugar de 50px) */
    .btn-submit {
      background: linear-gradient(95deg, #f3218b, #d41a76);
      border: none;
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(243, 33, 139, 0.25);
      font-family: 'Inter', sans-serif;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(243, 33, 139, 0.35);
    }

    /* Mensajes */
    .message {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 500;
      display: none;
      font-size: 0.85rem;
    }
    .success { background: #e6f7ec; color: #0e5e2e; border-left: 3px solid #27e083; }
    .error { background: #fff0f0; color: #c41e3a; border-left: 3px solid #f3218b; }
    .sending { background: #eef2ff; color: #1e3a5f; }

    /* Footer de tecnología */
    .tech-footer {
      background: #f8fafc;
      padding: 24px 20px;
      text-align: center;
      border-top: 1px solid #eef2f8;
    }
    .tech-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 16px;
    }
    .tech-item {
      text-align: center;
      flex: 1;
      min-width: 120px;
    }
    .tech-item img {
      max-height: 55px;
      width: auto;
      margin-bottom: 8px;
      opacity: 0.9;
    }
    .tech-item p {
      font-size: 0.7rem;
      font-weight: 600;
      color: #1e293b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .footer-copyright {
      font-size: 0.65rem;
      color: #94a3b8;
      margin-top: 12px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      body {
        padding: 16px;
      }
      .card-body {
        padding: 24px 20px;
      }
      .field {
        flex: 1 1 100%;
      }
      .tech-icons {
        gap: 16px;
      }
      .tech-item {
        min-width: 100px;
      }
      .tech-item img {
        max-height: 45px;
      }
      .btn-submit {
        border-radius: 35px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
<div class="form-wrapper">
  <div class="form-card">
    
    <!-- CABECERA: SOLO LA IMAGEN -->
    <div class="hero-image">
      <img src="https://laligaamasalvarvidas.org.co/Archivos/Imagenes/salon%20risaralda%202.png" alt="Simposio Oncología - Salón Risaralda 2">
    </div>

    <!-- FORMULARIO -->
    <div class="card-body">
      <form id="registroForm">
        <div class="form-grid">
          <div class="field"><label>NOMBRE COMPLETO <span class="required">*</span></label><input type="text" id="nombre" placeholder="Ej. Ana María López" required></div>
          <div class="field"><label>CÉDULA <span class="required">*</span></label><input type="text" id="cedula" placeholder="Número de identificación" required></div>
          <div class="field"><label>PROFESIÓN / ESTUDIANTE <span class="required">*</span></label><select id="profesion" required><option value="">Selecciona</option><option>Profesional</option><option>Estudiante</option><option>Otro</option></select></div>
          <div class="field"><label>ESPECIALIDAD</label><input type="text" id="especialidad" placeholder="Ej: Oncología, Radioterapia"></div>
          <div class="field"><label>CIUDAD <span class="required">*</span></label><input type="text" id="ciudad" placeholder="Ciudad" required></div>
          <div class="field"><label>TELÉFONO <span class="required">*</span></label><input type="tel" id="telefono" placeholder="Ej: 3001234567" required></div>
          <div class="field"><label>CORREO ELECTRÓNICO <span class="required">*</span></label><input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required></div>
          <div class="field"><label>INSTITUCIÓN</label><input type="text" id="institucion" placeholder="Empresa / Universidad"></div>
        </div>

        <div class="checkbox-field">
          <label class="checkbox-label">
            <input type="checkbox" id="autorizacion" required>
            <span><strong>Autorizo el tratamiento de mis datos personales</strong> según la política de privacidad. <span class="required">*</span></span>
          </label>
        </div>

        <button type="submit" class="btn-submit">INSCRIBIRME AHORA →</button>
        <div id="messageBox" class="message"></div>
      </form>
    </div>

    <!-- PIE DE PÁGINA CON TECNOLOGÍAS -->
    <div class="tech-footer">
      <div class="tech-icons">
        <div class="tech-item">

        </div>
        <div class="tech-item">

        </div>
        <div class="tech-item">
   
        </div>
      </div>
      <div class="footer-copyright">
        Fundación La Liga AmaSalvarVidas®
      </div>
    </div>

  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-vcBQBnwX0mNZo_TME6Vcl12llkl7ZKQTYdT_jcZUmwKBBmtM0KqUXwXttbRO-BNqhg/exec';
  
  const form = document.getElementById('registroForm');
  const messageBox = document.getElementById('messageBox');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    messageBox.style.display = 'none';
    messageBox.innerHTML = 'Enviando inscripción...';
    messageBox.className = 'message sending';
    messageBox.style.display = 'block';

    const datos = {
      nombre: document.getElementById('nombre').value,
      cedula: document.getElementById('cedula').value,
      profesion: document.getElementById('profesion').value,
      especialidad: document.getElementById('especialidad').value,
      ciudad: document.getElementById('ciudad').value,
      telefono: document.getElementById('telefono').value,
      correo: document.getElementById('correo').value,
      institucion: document.getElementById('institucion').value,
      autorizacion: document.getElementById('autorizacion').checked
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      messageBox.innerHTML = '✅ ¡Inscripción exitosa! Te esperamos en el Simposio.';
      messageBox.className = 'message success';
      form.reset();
    } catch (error) {
      messageBox.innerHTML = '❌ Error al enviar. Por favor intenta de nuevo.';
      messageBox.className = 'message error';
    }
    setTimeout(() => { messageBox.style.display = 'none'; }, 5000);
  });
</script>
</body>
</html>
